<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Reset password | Routine Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Routine Tracker</p>
            <h1>Reset password</h1>
            <p class="auth-copy">{{ message }}</p>
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label>Email<input type="email" name="email" autocomplete="email" required></label>
                <button class="primary-btn" type="submit">Send reset instructions</button>
            </form>
            <p class="auth-links"><a href="{{ url_for('login') }}">Back to sign in</a></p>
        </section>
    </main>
</body>
</html>
