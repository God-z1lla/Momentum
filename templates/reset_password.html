<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Set password | Routine Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Routine Tracker</p>
            <h1>Set a new password</h1>
            {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
            {% if not error or not error.startswith('This reset') %}
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label>New password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
                <button class="primary-btn" type="submit">Update password</button>
            </form>
            {% endif %}
            <p class="auth-links"><a href="{{ url_for('login') }}">Back to sign in</a></p>
        </section>
    </main>
</body>
</html>
