<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Sign in | Routine Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Routine Tracker</p>
            <h1>Sign in</h1>
            {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="next" value="{{ next_url or '' }}">
                <label>Email<input type="email" name="email" autocomplete="email" required></label>
                <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
                <button class="primary-btn" type="submit">Sign in</button>
            </form>
            <p class="auth-links"><a href="{{ url_for('register') }}">Create an account</a><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
        </section>
    </main>
</body>
</html>
